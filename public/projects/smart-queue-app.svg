<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <rect width="1600" height="1000" fill="#050505"/>

  <!-- top bar -->
  <rect x="0" y="0" width="1600" height="64" fill="#0b0b0c"/>
  <line x1="0" y1="64" x2="1600" y2="64" stroke="#1f1f1f" stroke-width="1"/>
  <circle cx="32" cy="32" r="7" fill="#3a3a3a"/>
  <circle cx="58" cy="32" r="7" fill="#3a3a3a"/>
  <circle cx="84" cy="32" r="7" fill="#3a3a3a"/>
  <rect x="130" y="16" width="440" height="32" rx="8" fill="#141414"/>
  <text x="150" y="37" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#8a8a8a">smart-queue.app/staff</text>
  <circle cx="1486" cy="32" r="5" fill="#22c55e"/>
  <text x="1500" y="37" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#22c55e" font-weight="600">LIVE</text>

  <!-- Left: visitor ticket screen -->
  <g>
    <rect x="64" y="104" width="420" height="820" rx="20" fill="#0b0b0c" stroke="#1f1f1f"/>
    <text x="274" y="150" text-anchor="middle" font-family="Arial" font-size="13" letter-spacing="2" fill="#5a5a5a">VISITOR VIEW</text>

    <text x="274" y="200" text-anchor="middle" font-family="Arial" font-size="14" fill="#9ca3af">Your ticket</text>
    <text x="274" y="300" text-anchor="middle" font-family="Arial" font-size="96" font-weight="700" fill="#22c55e">B042</text>

    <rect x="120" y="350" width="308" height="90" rx="14" fill="#141414"/>
    <text x="274" y="384" text-anchor="middle" font-family="Arial" font-size="12" fill="#9ca3af" letter-spacing="1">POSITION IN LINE</text>
    <text x="274" y="420" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#ffffff">4th</text>

    <rect x="120" y="456" width="308" height="90" rx="14" fill="#141414"/>
    <text x="274" y="490" text-anchor="middle" font-family="Arial" font-size="12" fill="#9ca3af" letter-spacing="1">ESTIMATED WAIT</text>
    <text x="274" y="526" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#ffffff">~12 min</text>

    <rect x="120" y="562" width="308" height="90" rx="14" fill="#0f2d1f"/>
    <text x="274" y="596" text-anchor="middle" font-family="Arial" font-size="12" fill="#7fe3ab" letter-spacing="1">SERVED AT</text>
    <text x="274" y="632" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#22c55e">Counter 2</text>

    <text x="274" y="720" text-anchor="middle" font-family="Arial" font-size="12" fill="#5a5a5a">Live updates · no manual refresh needed</text>
  </g>

  <!-- Right: staff dashboard with AI assistant -->
  <g>
    <rect x="516" y="104" width="1020" height="392" rx="20" fill="#0b0b0c" stroke="#1f1f1f"/>
    <text x="544" y="150" font-family="Arial" font-size="13" letter-spacing="2" fill="#5a5a5a">STAFF DASHBOARD</text>

    <g font-family="Arial">
      <rect x="544" y="176" width="220" height="100" rx="12" fill="#141414"/>
      <text x="564" y="204" font-size="12" fill="#9ca3af">COUNTER 1</text>
      <text x="564" y="240" font-size="22" font-weight="700" fill="#ffffff">6 waiting</text>
      <text x="564" y="262" font-size="11" fill="#22c55e">avg 6m</text>

      <rect x="780" y="176" width="220" height="100" rx="12" fill="#2a1414"/>
      <text x="800" y="204" font-size="12" fill="#f3a1a1">COUNTER 2</text>
      <text x="800" y="240" font-size="22" font-weight="700" fill="#ffffff">14 waiting</text>
      <text x="800" y="262" font-size="11" fill="#ef4444">avg 12m — falling behind</text>

      <rect x="1016" y="176" width="220" height="100" rx="12" fill="#141414"/>
      <text x="1036" y="204" font-size="12" fill="#9ca3af">COUNTER 3</text>
      <text x="1036" y="240" font-size="22" font-weight="700" fill="#ffffff">3 waiting</text>
      <text x="1036" y="262" font-size="11" fill="#22c55e">avg 4m</text>

      <rect x="1252" y="176" width="220" height="100" rx="12" fill="#141414"/>
      <text x="1272" y="204" font-size="12" fill="#9ca3af">TODAY</text>
      <text x="1272" y="240" font-size="22" font-weight="700" fill="#ffffff">312 served</text>
      <text x="1272" y="262" font-size="11" fill="#9ca3af">since 08:00</text>
    </g>

    <!-- AI assistant panel -->
    <rect x="544" y="304" width="968" height="164" rx="14" fill="#0a0f0c" stroke="#22c55e" stroke-opacity="0.3"/>
    <circle cx="576" cy="336" r="10" fill="#22c55e"/>
    <text x="596" y="341" font-family="Arial" font-size="13" font-weight="700" fill="#22c55e">Claude — Queue Assistant</text>

    <rect x="564" y="358" width="520" height="40" rx="10" fill="#141414"/>
    <text x="580" y="383" font-family="Arial" font-size="13" fill="#c9c9c9">"Which counter is falling behind right now?"</text>

    <rect x="564" y="406" width="920" height="46" rx="10" fill="#0f2d1f"/>
    <text x="580" y="434" font-family="Arial" font-size="13" fill="#c9f7d8">Counter 2 — 14 people waiting, avg 12 min. Suggest opening Counter 4 to rebalance flow.</text>
  </g>

  <!-- architecture strip -->
  <g font-family="Arial">
    <rect x="516" y="524" width="1020" height="400" rx="20" fill="#0b0b0c" stroke="#1f1f1f"/>
    <text x="544" y="570" font-size="13" letter-spacing="2" fill="#5a5a5a">TICKET FLOW — LAST 2 HOURS</text>

    <polyline points="560,760 660,700 760,730 860,650 960,690 1060,610 1160,640 1260,580 1360,600 1460,540"
      fill="none" stroke="#22c55e" stroke-width="3"/>
    <g fill="#22c55e">
      <circle cx="560" cy="760" r="4"/><circle cx="660" cy="700" r="4"/><circle cx="760" cy="730" r="4"/>
      <circle cx="860" cy="650" r="4"/><circle cx="960" cy="690" r="4"/><circle cx="1060" cy="610" r="4"/>
      <circle cx="1160" cy="640" r="4"/><circle cx="1260" cy="580" r="4"/><circle cx="1360" cy="600" r="4"/><circle cx="1460" cy="540" r="4"/>
    </g>
    <line x1="544" y1="800" x2="1500" y2="800" stroke="#1f1f1f"/>
    <text x="544" y="826" font-size="12" fill="#5a5a5a">08:00</text>
    <text x="1470" y="826" font-size="12" fill="#5a5a5a">10:00</text>
    <text x="990" y="826" text-anchor="middle" font-size="12" fill="#5a5a5a">Tickets issued per 10-minute window</text>
  </g>
</svg>
