  <circle cx="32" cy="32" r="7" fill="#3a3a3a"/>
  <circle cx="58" cy="32" r="7" fill="#3a3a3a"/>
  <circle cx="84" cy="32" r="7" fill="#3a3a3a"/>
  <rect x="130" y="16" width="440" height="32" rx="8" fill="#141414"/>
  <text x="150" y="37" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="15" fill="#8a8a8a">smartnet-guard.internal/dashboard</text>
  <circle cx="1486" cy="32" r="5" fill="#22c55e"/>
  <text x="1500" y="37" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="14" fill="#22c55e" font-weight="600">LIVE</text>

