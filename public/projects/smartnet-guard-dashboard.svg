    <text x="936" y="210" font-size="12" letter-spacing="1.5" fill="#8a8a8a">ACTIVE ALERTS</text>
    <text x="936" y="252" font-size="32" font-weight="700" fill="#f59e0b">3</text>
    <text x="1200" y="252" font-size="13" fill="#5a5a5a" text-anchor="end">1 critical</text>

    <!-- card 4 -->
    <rect x="1242" y="176" width="310" height="112" rx="12" fill="#0d0d0d" stroke="#1f1f1f"/>
    <text x="1266" y="210" font-size="12" letter-spacing="1.5" fill="#8a8a8a">AVG ALERT RESPONSE</text>
    <text x="1266" y="252" font-size="32" font-weight="700" fill="#fafafa">42s</text>
    <text x="1530" y="252" font-size="13" fill="#22c55e" text-anchor="end">-18%</text>
  </g>

