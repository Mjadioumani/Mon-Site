  <path d="M280 560 C 340 540, 380 460, 440 470 C 500 480, 540 420, 600 430 C 660 440, 700 500, 760 490 C 820 480, 860 380, 920 390 C 980 400, 1020 460, 1080 450 C 1140 440, 1180 340, 1240 350 C 1300 360, 1340 430, 1400 420 C 1450 412, 1490 400, 1540 405 L 1540 600 L 280 600 Z" fill="url(#sg-spark1)" stroke="none"/>
  <path d="M280 560 C 340 540, 380 460, 440 470 C 500 480, 540 420, 600 430 C 660 440, 700 500, 760 490 C 820 480, 860 380, 920 390 C 980 400, 1020 460, 1080 450 C 1140 440, 1180 340, 1240 350 C 1300 360, 1340 430, 1400 420 C 1450 412, 1490 400, 1540 405" fill="none" stroke="#22c55e" stroke-width="3"/>

