    <rect x="582" y="176" width="310" height="112" rx="12" fill="#0d0d0d" stroke="#1f1f1f"/>
    <text x="606" y="210" font-size="12" letter-spacing="1.5" fill="#8a8a8a">UPTIME (30D)</text>
    <text x="606" y="252" font-size="32" font-weight="700" fill="#22c55e">99.97%</text>
    <path d="M730 268 L750 262 L770 264 L790 258 L810 260 L830 254 L870 256" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

