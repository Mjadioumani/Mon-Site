  <text x="32" y="320" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#9ca3af">Security Logs</text>
  <text x="32" y="376" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#9ca3af">ETL Jobs</text>
  <text x="32" y="432" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#9ca3af">Reports</text>

  <line x1="24" y1="880" x2="196" y2="880" stroke="#1f1f1f"/>
  <circle cx="40" cy="912" r="14" fill="#1f1f1f"/>
