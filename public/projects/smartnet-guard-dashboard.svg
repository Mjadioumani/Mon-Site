    <!-- row 1 -->
    <rect x="280" y="762" width="86" height="24" rx="12" fill="#3a1414"/>
    <text x="323" y="778" fill="#f87171" text-anchor="middle" font-size="11" font-weight="700">CRITICAL</text>
    <text x="440" y="779" fill="#e5e5e5" font-family="ui-monospace,monospace" font-size="13">srv-db-02</text>
    <text x="760" y="779" fill="#c9c9c9">Disk usage above 92% threshold</text>
    <text x="1420" y="779" fill="#6b7280" font-family="ui-monospace,monospace" font-size="12">2 min ago</text>

    <!-- row 2 -->
    <rect x="280" y="800" width="86" height="24" rx="12" fill="#3a2a10"/>
    <text x="323" y="816" fill="#fbbf24" text-anchor="middle" font-size="11" font-weight="700">WARNING</text>
    <text x="440" y="817" fill="#e5e5e5" font-family="ui-monospace,monospace" font-size="13">gw-edge-01</text>
    <text x="760" y="817" fill="#c9c9c9">Latency spike detected on uplink</text>
    <text x="1420" y="817" fill="#6b7280" font-family="ui-monospace,monospace" font-size="12">14 min ago</text>

    <!-- row 3 -->
    <rect x="280" y="838" width="86" height="24" rx="12" fill="#3a2a10"/>
    <text x="323" y="854" fill="#fbbf24" text-anchor="middle" font-size="11" font-weight="700">WARNING</text>
    <text x="440" y="855" fill="#e5e5e5" font-family="ui-monospace,monospace" font-size="13">srv-app-05</text>
    <text x="760" y="855" fill="#c9c9c9">CPU sustained above 80% for 5 min</text>
    <text x="1420" y="855" fill="#6b7280" font-family="ui-monospace,monospace" font-size="12">27 min ago</text>

    <!-- row 4 -->
    <rect x="280" y="876" width="66" height="24" rx="12" fill="#12321f"/>
    <text x="313" y="892" fill="#4ade80" text-anchor="middle" font-size="11" font-weight="700">INFO</text>
    <text x="440" y="893" fill="#e5e5e5" font-family="ui-monospace,monospace" font-size="13">etl-worker</text>
    <text x="760" y="893" fill="#c9c9c9">Log ingestion batch completed (18,204 events)</text>
    <text x="1420" y="893" fill="#6b7280" font-family="ui-monospace,monospace" font-size="12">31 min ago</text>

    <!-- row 5 -->
    <rect x="280" y="914" width="66" height="24" rx="12" fill="#12321f"/>
    <text x="313" y="930" fill="#4ade80" text-anchor="middle" font-size="11" font-weight="700">INFO</text>
    <text x="440" y="931" fill="#e5e5e5" font-family="ui-monospace,monospace" font-size="13">srv-web-01</text>
    <text x="760" y="931" fill="#c9c9c9">Scheduled backup completed successfully</text>
    <text x="1420" y="931" fill="#6b7280" font-family="ui-monospace,monospace" font-size="12">48 min ago</text>
  </g>
