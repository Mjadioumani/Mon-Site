    <text x="952" y="452" fill="#c9c9c9">sales_q3.xlsx</text>
    <text x="1180" y="452" fill="#c9c9c9">842</text>
    <text x="1300" y="452" fill="#22c55e">loaded</text>

    <text x="952" y="484" fill="#c9c9c9">ops_kpi_w36.xlsx</text>
    <text x="1180" y="484" fill="#c9c9c9">1,204</text>
    <text x="1300" y="484" fill="#22c55e">loaded</text>

    <text x="952" y="516" fill="#c9c9c9">hr_headcount.xlsx</text>
