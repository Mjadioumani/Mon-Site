      <rect x="540" y="440" width="46" height="180" rx="4"/>
      <rect x="600" y="460" width="46" height="160" rx="4" opacity="0.85"/>
      <rect x="660" y="410" width="46" height="210" rx="4"/>
      <rect x="720" y="400" width="46" height="220" rx="4"/>
